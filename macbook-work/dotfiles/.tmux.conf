# ~/.tmux.conf — sensible defaults

# True color + 256 color support
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc,xterm-256color:Tc"

# Mouse support (scroll, select panes/windows, resize)
set -g mouse on

# Start window/pane numbering at 1, renumber on close
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Bigger scrollback buffer
set -g history-limit 100000

# Faster command sequences (no escape-key lag in vim)
set -sg escape-time 10

# Intuitive splits: | = vertical, - = horizontal (keep current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New windows keep current path
bind c new-window -c "#{pane_current_path}"

# Reload config with prefix + r
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# vi-style copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Pane navigation with prefix + h/j/k/l
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Minimal status bar
set -g status-style "bg=default fg=white"
set -g status-left "#[bold]#S "
set -g status-right "%Y-%m-%d %H:%M "
set -g status-right-length 40
